<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - AquaGuard</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'dashboard.css' %}">
</head>
<body>
    <div class="header">
        <h1>AquaGuard System Login</h1>
    </div>
    <div class="login-container">
        <form method="post">
            {% csrf_token %} {{ form.as_p }}
            <button type="submit" class="control-button on">Login</button>
        </form>
        <div style="margin-top:12px; text-align:center;">
            <a href="{% url 'public_home' %}" class="nav-button home-button" title="Back to Home">
                <i class="fas fa-home"></i>
            </a>
        </div>
    </div>
</body>
</html>

<style>
    .login-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background-color: rgba(255, 255, 255, 0.95);
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .login-container form p {
        margin-bottom: 15px;
    }
    .login-container label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }
    .login-container input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }
    .home-button {
        display: inline-block;
        padding: 10px 15px;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 16px;
        transition: background-color 0.3s;
    }
    .home-button:hover {
        background-color: #0056b3;
        color: white;
    }
</style>
