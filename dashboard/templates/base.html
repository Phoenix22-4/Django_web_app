<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="gozFYv5nyWjXLad_h2RbQmBXExLGXbRUvxqDMgDW4Es" />
    
    <meta name="theme-color" content="#22c55e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AquaSavvy">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
    <link rel="manifest" href="{% url 'manifest' %}">
    <link rel="canonical" href="{{ canonical_url }}" />
    
    <title>{% block title %}AquaSavvy Solution{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'dashboard.css' %}">
</head>
<body>
    <form style="display:none;">{% csrf_token %}</form>

    {% block content %}{% endblock %}

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
    <script>
      // Firebase config from environment variables (secure)
      const firebaseConfig = {
        apiKey: "{{ firebase_api_key }}",
        authDomain: "{{ firebase_project_id }}.firebaseapp.com",
        projectId: "{{ firebase_project_id }}",
        storageBucket: "{{ firebase_project_id }}.appspot.com",
        messagingSenderId: "{{ firebase_messaging_sender_id }}",
        appId: "{{ firebase_app_id }}",
        measurementId: "{{ firebase_measurement_id|default:'' }}"
      };
      if (window.firebase && !window.__firebaseInitialized) {
        firebase.initializeApp(firebaseConfig);
        window.__firebaseInitialized = true;
      }
    </script>
    
    <script src="{% static 'push_handler.js' %}"></script>
    <link rel="stylesheet" href="{% static 'aquasavvy-chat.css' %}">
    <script src="{% static 'aquasavvy-chat.js' %}"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('{% url "service_worker" %}')
            .then(registration => {
              console.log('✅ AquaSavvy Service Worker registered:', registration);
            })
            .catch(error => {
              console.error('❌ Service Worker registration failed:', error);
            });
        });
      }
    </script>
    </body>
</html>
