<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="gozFYv5nyWjXLad_h2RbQmBXExLGXbRUvxqDMgDW4Es" />
    
    <title>{% block title %}AquaSavvy Solution{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'dashboard.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    {% block content %}{% endblock %}

    <!-- FLOATING AI CHAT WIDGET (Like Amazon/Redmi) -->
    <button id="ai-chat-icon" class="chat-icon" aria-label="Open AquaSavvy AI Assistant">
        💬
    </button>

    <div id="ai-chat-panel" class="chat-panel">
        <div class="chat-panel-header">
            <h3>AquaSavvy AI Assistant</h3>
            <button id="ai-chat-close" class="chat-close-btn" aria-label="Close chat">×</button>
        </div>
        <div id="ai-chat-messages" class="chat-panel-body">
            <div class="chat-message ai-message">
                Hello! 👋 I'm your AquaSavvy AI Assistant. How can I help you understand your water system today?
            </div>
        </div>
        <div class="chat-panel-footer">
            {% csrf_token %}
            <input type="text" id="ai-chat-input" placeholder="Ask a question..." autocomplete="off" />
            <button id="ai-chat-send" aria-label="Send message">Send</button>
        </div>
    </div>

    <!-- Firebase SDK for Push Notifications -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
    <script>
      // Firebase config
      const firebaseConfig = {
        apiKey: "AIzaSyCuorzrk2791U7GwqK0EziVFUlWI0NUMKc",
        authDomain: "aquasavvy-solution.firebaseapp.com",
        projectId: "aquasavvy-solution",
        storageBucket: "aquasavvy-solution.firebasestorage.app",
        messagingSenderId: "106611964149",
        appId: "1:106611964149:web:7beee215e4dedc406eedbc",
        measurementId: "G-TYENWVXT5R"
      };
      if (window.firebase && !window.__firebaseInitialized) {
        firebase.initializeApp(firebaseConfig);
        window.__firebaseInitialized = true;
      }
    </script>
    <script src="{% static 'push_handler.js' %}"></script>
    <script src="{% static 'chat.js' %}"></script>
</body>
</html>
