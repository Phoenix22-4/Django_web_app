<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - AquaGuard</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'dashboard.css' %}">
</head>
<body>
    <div class="header" style="background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); color: white; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <h1>AquaGuard System Login</h1>
    </div>
    <div class="login-container">
        <form method="post">
            {% csrf_token %} {{ form.as_p }}
            <div class="button-row">
                <button type="submit" class="control-button on">Login</button>
                <a href="{% url 'public_home' %}" class="nav-button home-button" title="Back to Home">
                    <i class="fas fa-home"></i> Home
                </a>
            </div>
        </form>
    </div>
</body>
</html>

<style>
    .login-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background-color: rgba(255, 255, 255, 0.95);
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .login-container form p {
        margin-bottom: 15px;
    }
    .login-container label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }
    .login-container input {
        width: 100%;
        padding: 10px;
        ng: 10px 15px;
        background-color: #2dfd12;
        border: 1px solid #cccccc;
        border-radius: 5px;
        box-sizing: border-box;
    }
    .control-button {
        display: inline-block;
        padding: 10px 15px;
        background-color: #22c55e;
        color: white;
        text-decoration: none;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        transition: background-color 0.3s;
        cursor: pointer;
        width: 120px;
    }
    .control-button:hover {
        background-color: #16a34a;
        color: white;
    }
    .home-button {
        display: inline-block;
        padding: 10px 15px;
        background-color: #0ea5e9;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 16px;
        transition: background-color 0.3s;
        width: 120px;
        text-align: center;
    }
    .home-button:hover {
        background-color: #0284c7;
        color: white;
    }
    .button-row {
        display: flex;
        gap: 15px;
        justify-content: center;
        align-items: center;
        margin-top: 20px;
    }
    .button-row .control-button {
        flex: 1;
        max-width: 120px;
    }
    .button-row .home-button {
        flex: 1;
        max-width: 120px;
        text-align: center;
    }
</style>
