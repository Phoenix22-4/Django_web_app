<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Canonical URL for SEO - Level 1 SEO requirement -->
    <link rel="canonical" href="{{ canonical_url }}" />
    
    <title>Login - AquaSavvy</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'dashboard.css' %}">
</head>
<body>
    <div class="header">
        <h1>AquaSavvy System Login</h1>
    </div>
    <div class="login-container">
        <form method="post">
            {% csrf_token %} {{ form.as_p }}
            <div class="button-row">
                <button type="submit" class="control-button on">Login</button>
                <a href="{% url 'public_home' %}" class="nav-button home-button" title="Back to Home">
                    <i class="fas fa-home"></i> Home
                </a>
            </div>
        </form>
    </div>
</body>
</html>

<style>
    .login-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background-color: rgba(255, 255, 255, 0.95);
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .login-container form p {
        margin-bottom: 15px;
    }
    .login-container label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }
    .login-container input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }
    .home-button {
        display: inline-block;
        padding: 10px 15px;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 16px;
        transition: background-color 0.3s;
    }
    .home-button:hover {
        background-color: #0056b3;
        color: white;
    }
    .button-row {
        display: flex;
        gap: 15px;
        justify-content: center;
        align-items: center;
        margin-top: 20px;
    }
    .button-row .control-button {
        flex: 1;
        max-width: 120px;
        background-color: #22c55e !important; /* Green color for login button */
        border: none;
        color: white;
        padding: 12px 20px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    .button-row .control-button:hover {
        background-color: #16a34a !important; /* Darker green on hover */
    }
    .button-row .home-button {
        flex: 1;
        max-width: 120px;
        text-align: center;
    }
</style>
